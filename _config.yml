url: "https://www.opentargets.org/"
baseurl: ""
repository: opentargets/opentargets.github.io

title: "Open Targets"

collections_dir: my_collections

collections:
  jobs: {}
  executive_leadership_team: {}
  scientific_leadership_team: {}
  strategy_operations_team: {}
  scientific_advisory_board: {}
  informatics_team: {}
  validation_lab_team: {}
  history_timeline: {}
  resources: {}
  news:
    output: true

future: true

plugins:
  - jekyll-get-json
  - jekyll-paginate-v2

jekyll_get_json:
  - data: ghost_api_response
    json: 'https://open-targets-blog.ghost.io/ghost/api/v3/content/posts/?key=6f5f3e6aa359bf5ad18bb2855d&fields=title,slug,published_at,custom_excerpt&include=authors&limit=4'
  - data: ghost_api_releases
    json: 'https://open-targets-blog.ghost.io/ghost/api/v3/content/posts/?key=6f5f3e6aa359bf5ad18bb2855d&fields=title,slug,feature_image,feature_image_alt&filter=tag%3Arelease-notes&limit=1'

exclude:
  - docs/
  - vendor/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - .sass-cache/
  - .jekyll-cache/
